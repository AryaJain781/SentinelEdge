[project]
name = "ondevice-threat-detection"
version = "0.1.0"
description = "On-device cyber threat detection with a small Llama-based explainer (offline, Arm/Android target)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "scikit-learn==1.4.2",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "joblib==1.3.2",
]

[project.optional-dependencies]
dev = [
    "black==24.4.2",
    "ruff==0.4.4",
    "pytest==8.2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ---------------- Black (formatter) ----------------
[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = '''
/(
    \.venv
  | data
  | models
  | notebooks
)/
'''

# ---------------- Ruff (linter) ----------------
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["data", "models", "notebooks", "benchmarks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import order)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ---------------- Pytest (tester) ----------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
